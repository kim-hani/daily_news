plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }          // KOMORAN 전용
}

dependencies {
    implementation 'com.rometools:rome:2.1.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.thymeleaf:thymeleaf:3.1.5.RELEASE'
    implementation 'com.github.shin285:KOMORAN:3.3.9'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.4'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    runtimeOnly    'org.slf4j:slf4j-simple:2.0.20'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

application {
    mainClass = 'dailynews.DailyNewsApp'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform {
        excludeTags 'live'
    }
}

tasks.register('liveTest', Test) {
    description = '실제 언론사 피드에 접속하는 라이브 테스트(@Tag("live"))'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
}
