# Daily News 설정. 코드 수정 없이 언론사·피드·보관 기간을 바꿀 수 있다(US8, FR-2.4, FR-7.5).
# 다른 파일로 바꾸려면: ./gradlew run --args="--config path/to/sources.yml"

userAgent: "DailyNewsBot/1.0 (+https://github.com/kim-hani/daily_news)"
siteUrl: "https://kim-hani.github.io/daily_news/"        # GitHub Pages 주소(README에 표시)
repositoryUrl: "https://github.com/kim-hani/daily_news"  # 아카이브 페이지의 Markdown 링크
requestDelayMillis: 1000      # 같은 호스트에 연속 요청할 때 간격
hostDelayMillis:              # 호스트별 간격(기본값보다 길게 둘 곳)
  www.khan.co.kr: 10000       # 경향신문은 1초 간격 연속 요청에 403(빈도 제한)을 돌려줌(2026-10-28 확인)
timeoutSeconds: 10
windowHours: 24               # 최근 몇 시간 안의 기사만 쓸지
perCategory: 5                # 카테고리별 선정 기사 수
clusterThreshold: 0.4         # 같은 사안으로 묶는 제목 유사도 기준(0 초과 1 이하)

retention:
  siteArchiveDays: 30         # 웹 날짜별 페이지 보관 일수(실행일 포함)
  newsDays: 0                 # Markdown 보관 일수, 0 = 무기한(삭제 안 함)

# 피드 키는 POLITICS, SOCIETY, ECONOMY, IT, GLOBAL 중 하나다.
# 서울신문은 robots.txt가 RSS 경로(/xml/)를 막고 있어 제외했다(spec C4).
sources:
  - id: yonhap
    name: 연합뉴스
    domains: [yna.co.kr]                # 기사 링크로 허용하는 도메인(하위 도메인 포함)
    bodySelector: "div.story-news.article > p"
    creditPatterns:
      - '^\(.+?=연합뉴스\)\s*[^=]{0,40}?(기자|특파원)\s*=\s*'   # 기자가 여럿일 수 있다: (서울=연합뉴스) 김효정 전명훈 기자 =
    feeds:
      POLITICS: https://www.yna.co.kr/rss/politics.xml
      SOCIETY: https://www.yna.co.kr/rss/society.xml
      ECONOMY: https://www.yna.co.kr/rss/economy.xml
      IT: https://www.yna.co.kr/rss/industry.xml
      GLOBAL: https://www.yna.co.kr/rss/international.xml
    itKeywordFilterFeeds: [IT]          # 산업 피드는 IT 키워드가 맞는 기사만 사용(FR-3.3)

  - id: donga
    name: 동아일보
    domains: [donga.com]
    bodySelector: "section.news_view"
    feeds:
      POLITICS: https://rss.donga.com/politics.xml
      SOCIETY: https://rss.donga.com/national.xml
      ECONOMY: https://rss.donga.com/economy.xml
      IT: https://rss.donga.com/science.xml
      GLOBAL: https://rss.donga.com/international.xml
    itKeywordFilterFeeds: [IT]          # 과학 피드에 건강·의학 기사가 섞여 IT 키워드로 거름(T-034)

  - id: khan
    name: 경향신문
    domains: [khan.co.kr]
    bodySelector: "div#articleBody p.content_text"
    feeds:
      POLITICS: https://www.khan.co.kr/rss/rssdata/politic_news.xml
      SOCIETY: https://www.khan.co.kr/rss/rssdata/society_news.xml
      ECONOMY: https://www.khan.co.kr/rss/rssdata/economy_news.xml
      IT: https://www.khan.co.kr/rss/rssdata/science_news.xml
      GLOBAL: https://www.khan.co.kr/rss/rssdata/kh_world.xml
    itKeywordFilterFeeds: [IT]          # 과학 피드에 날씨 기사가 섞여 IT 키워드로 거름(T-034)

itKeywords: [AI, 인공지능, 반도체, 통신, 5G, 6G, 플랫폼, 앱, 소프트웨어, 보안, 해킹, 클라우드, 데이터센터,
             게임, 로봇, 우주, 배터리, 디스플레이, 네이버, 카카오, 삼성전자, SK하이닉스,
             IT, 디지털, 인터넷, 스마트폰, 사이버, 양자, 휴머노이드, 챗GPT, 오픈AI, 엔비디아, 구글, 애플, 위성, 발사체]

# 키워드 불용어(조정 가능). 매일 나오는 일반어는 T-034 실제 실행 결과를 보고 추가했다.
stopwords: [기자, 오늘, 내일, 올해, 지난해, 관련, 대통령실, 정부,
            대통령, 내년, 이번, 이날, 전날, 최근, 분기, 영업, 공개, 사진, 영상, 종합, 속보, 단독, 최대, 현장, 지원]
