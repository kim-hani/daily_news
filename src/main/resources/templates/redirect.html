<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--/* 옛 주소(archive.html)를 새 페이지로 보낸다(spec FR-1.3). 자동 이동이 막혀도 링크를 누를 수 있다. */-->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="refresh" th:content="|0; url=${target}|">
    <meta name="robots" content="noindex">
    <title>뉴스 캘린더로 이동 · Daily News</title>
    <link rel="canonical" th:href="${target}">
    <link rel="icon" href="data:,">
</head>
<body>
<main>
    <p>지난 뉴스레터는 이제 <a th:href="${target}">뉴스 캘린더</a>에서 볼 수 있습니다.</p>
</main>
</body>
</html>
