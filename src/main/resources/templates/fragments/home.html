<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* 히어로 두 줄(m-variable-font-hover-2, plan §6.2.1). 줄에 마우스를 올리면 그 줄 글자가 차례로 바뀐다.
       1줄은 wght 100 → 900·기울기, 2줄은 반대로. 글자는 템플릿에서 정적으로 나누고, 스크린리더는 h1의 aria-label만 읽는다.
       글자별 지연 순서(--i)는 app.js가 넣는다. JS가 없으면 지연 없이 한꺼번에 바뀐다. */-->
<h1 th:fragment="hero" class="hero text-display" lang="en" aria-label="EveryDay. News Feed" data-variable-hover>
    <span class="hero-line hero-line-from" data-stagger="first" aria-hidden="true"><span>E</span><span>v</span><span>e</span><span>r</span><span>y</span><span>D</span><span>a</span><span>y</span><span>.</span></span>
    <span class="hero-line hero-line-to text-muted-foreground" data-stagger="last" aria-hidden="true"><span>N</span><span>e</span><span>w</span><span>s</span><span> </span><span>F</span><span>e</span><span>e</span><span>d</span></span>
</h1>

<!--/* flow-button. 같은 컴포넌트의 primary(채움)·secondary(외곽선) 변형이다. 가운데 점이 커지며 배경을 채우고 화살표가 바뀐다.
       반복 흐름 효과는 없고 hover·focus 때만 움직인다. */-->
<a th:fragment="primary(href, label)" class="flow-btn flow-btn-primary" data-cta="primary" lang="en"
   th:href="${href}">
    <svg th:replace="~{fragments/icons :: arrow-right('flow-btn-arrow flow-btn-arrow-in')}"></svg>
    <span class="flow-btn-text" th:text="${label}">Today</span>
    <span class="flow-btn-circle" aria-hidden="true"></span>
    <svg th:replace="~{fragments/icons :: arrow-right('flow-btn-arrow flow-btn-arrow-out')}"></svg>
</a>

<a th:fragment="secondary(href, label)" class="flow-btn flow-btn-secondary" data-cta="secondary" lang="en"
   th:href="${href}">
    <svg th:replace="~{fragments/icons :: arrow-right('flow-btn-arrow flow-btn-arrow-in')}"></svg>
    <span class="flow-btn-text" th:text="${label}">Calendar</span>
    <span class="flow-btn-circle" aria-hidden="true"></span>
    <svg th:replace="~{fragments/icons :: arrow-right('flow-btn-arrow flow-btn-arrow-out')}"></svg>
</a>

</body>
</html>
