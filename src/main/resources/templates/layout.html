<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 페이지들이 함께 쓰는 조각. base는 site/ 루트까지의 상대 경로("" 또는 "../")다. -->

<head th:fragment="head(title, base)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title}">Daily News</title>
    <link rel="stylesheet" th:href="${base} + 'assets/style.css'">
    <script th:src="${base} + 'assets/tabs.js'" defer></script>
</head>

<header th:fragment="header(base, dateLabel)" class="site-header">
    <p class="brand"><a th:href="${base} + 'index.html'">📰 Daily News</a></p>
    <p class="date" th:if="${dateLabel != null}" th:text="${dateLabel}">2026-10-28 (수)</p>
    <nav aria-label="사이트">
        <a th:href="${base} + 'index.html'">오늘</a>
        <a th:href="${base} + 'archive.html'">지난 뉴스레터</a>
    </nav>
</header>

<footer th:fragment="footer(generatedAt, repositoryUrl)" class="site-footer">
    <p>요약은 각 기사 원문의 앞부분(최대 200자)을 그대로 인용한 것이며 저작권은 각 언론사에 있습니다.
        기사 전문은 원문 링크에서 읽어 주세요.</p>
    <p>
        <span th:text="|생성: ${generatedAt}|">생성: 2026-10-28 09:00 KST</span>
        <span th:if="${repositoryUrl != null}"> · <a th:href="${repositoryUrl}">GitHub 저장소</a></span>
    </p>
</footer>

</html>
