name: daily-news

# 매일 12:00 KST에 뉴스레터를 만들어 main에 커밋하고 GitHub Pages로 배포한다(FR-1, FR-8).
# 처음 쓰기 전에 docs/feature/daily-news/setup-guide.md의 GitHub 설정이 필요하다.
# GitHub 예약 실행은 몇 시간씩 늦거나 빠질 수 있어서, 12:00 정시 실행은 외부 스케줄러(cron-job.org)가
# workflow_dispatch API를 호출해 시작한다(FR-1.1). schedule은 외부 호출이 실패한 날을 위한 백업이다.
on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC = 13:17 KST 백업 (FR-1.4, 정각 혼잡을 피해 17분)
  workflow_dispatch: {}    # 외부 스케줄러 12:00 KST 호출 + 수동 실행 (FR-1.1, FR-1.2)

permissions: {}

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  # 배포 키·커밋 작성자 설정이 없으면 실패 대신 경고를 남기고 건너뛴다(설정 전 매일 실패 알림 방지).
  # 백업 schedule 실행은 오늘(KST) 뉴스레터가 이미 main에 있으면 건너뛴다(FR-1.4).
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # 오늘 뉴스레터 파일 존재 확인
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DEPLOY_KEY: ${{ secrets.NEWS_DEPLOY_KEY }}
          COMMIT_NAME: ${{ vars.NEWS_COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.NEWS_COMMIT_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$COMMIT_NAME" ] || [ -z "$COMMIT_EMAIL" ]; then
            echo "::warning::NEWS_DEPLOY_KEY, NEWS_COMMIT_NAME, NEWS_COMMIT_EMAIL 중 빠진 설정이 있어 건너뜁니다. docs/feature/daily-news/setup-guide.md를 참고하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="news/$(TZ=Asia/Seoul date +%Y/%m/%F).md"
          if [ "$EVENT" = "schedule" ] && gh api "repos/$GITHUB_REPOSITORY/contents/$today?ref=main" --silent 2>/dev/null; then
            echo "오늘 뉴스레터($today)가 이미 있어 백업 실행을 건너뜁니다"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read          # push는 배포 키(SSH)로 한다
    env:
      TZ: Asia/Seoul          # 커밋 메시지 날짜와 출력 날짜를 KST로 (FR-1.3)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.NEWS_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4   # 의존성 캐시(KOMORAN 포함)

      - name: Generate newsletter
        run: ./gradlew run --no-daemon         # 수집 0건이면 종료 코드 1 → 이후 단계(커밋·배포) 생략 (NFR-2)

      - name: Commit and push to main
        env:
          COMMIT_NAME: ${{ vars.NEWS_COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.NEWS_COMMIT_EMAIL }}
        run: |
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add -A news site README.md        # 보관 기간이 지나 삭제된 파일도 스테이징
          if git diff --cached --quiet; then    # FR-8.3
            echo "변경 사항이 없어 커밋하지 않습니다"
            exit 0
          fi
          git commit -m "news: $(date +%F) daily newsletter"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
